<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fafafa;color:#09090b;font-family:Inter,sans-serif}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid #e4e4e7}
nav .logo{font-weight:600;font-size:18px}nav .links{display:flex;gap:32px;font-size:14px;color:#52525b}nav .cart{width:40px;height:40px;border-radius:999px;background:#09090b}
.spread{display:grid;grid-template-columns:1fr 1fr;height:828px}
.photo{margin:16px 0 16px 16px;border-radius:18px;background:linear-gradient(180deg,#3a2a14,#6b4c22 40%,#c9b48f 55%,#5a4626);position:relative;overflow:hidden}
.photo:after{content:"";position:absolute;left:0;right:0;top:120px;height:3px;background:#1a120a}
.gutter{position:absolute;left:720px;top:72px;bottom:0;width:1px;background:#e4e4e7}
.page{padding:80px 72px 40px 80px;display:flex;flex-direction:column}
h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:88px;line-height:1;letter-spacing:-.02em}
.lede{margin-top:24px;width:420px;height:44px;background:#e4e4e7;border-radius:6px}
.search{margin-top:36px;display:flex;gap:12px}.search .in{flex:1;height:52px;border-radius:12px;border:1px solid #d4d4d8;background:#fff}.search .btn{width:120px;height:52px;border-radius:12px;background:#09090b}
.feat{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.feat div{height:250px;border-radius:14px;background:#e7e1d6;position:relative}.feat div:after{content:"";position:absolute;left:0;right:0;bottom:-34px;height:22px;background:#e4e4e7;border-radius:4px;width:70%}
</style></head><body>
<nav><div class="logo">Dress Shopy</div><div class="links"><span>Inicio</span><span>Artículos</span><span>Perfil</span><span>Carrito</span></div><div class="cart"></div></nav>
<div class="gutter"></div>
<div class="spread"><div class="photo"></div><div class="page"><h1>Prendas<br>elegidas,<br>una a una.</h1><div class="lede"></div><div class="search"><div class="in"></div><div class="btn"></div></div><div class="feat"><div></div><div></div></div></div></div>
</body></html>
