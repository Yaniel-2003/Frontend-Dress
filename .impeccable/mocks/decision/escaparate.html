<!doctype html><html lang="es"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#fafafa;color:#09090b;font-family:Inter,sans-serif}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:#fff;border-bottom:1px solid #e4e4e7}
nav .logo{font-weight:600;font-size:18px}nav .links{display:flex;gap:32px;font-size:14px;color:#52525b}nav .cart{width:40px;height:40px;border-radius:999px;background:#09090b}
.band{position:relative;height:500px;margin:12px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#2a1d0e,#6b4c22 45%,#c9b48f 60%,#3a2a14)}
.band:before{content:"";position:absolute;left:0;right:0;top:110px;height:3px;background:#1a120a}
.band:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0b0b0cdd,transparent 65%)}
.copy{position:absolute;left:56px;bottom:48px;z-index:2;color:#fafafa;display:flex;align-items:end;gap:64px;right:56px;justify-content:space-between}
h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:80px;line-height:1;letter-spacing:-.02em}
.search{display:flex;gap:10px;width:520px}.search .in{flex:1;height:54px;border-radius:12px;background:#ffffff26;border:1px solid #ffffff55}.search .btn{width:120px;height:54px;border-radius:12px;background:#fafafa}
.filters{margin:8px 60px 0;height:56px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #e4e4e7}
.filters i{height:36px;width:110px;border-radius:999px;border:1px solid #d4d4d8}.filters i:first-child{background:#09090b;border-color:#09090b}
.rail{margin:24px 60px;display:flex;gap:20px}.rail div{flex:0 0 260px;height:260px;border-radius:14px;background:#e7e1d6}
h2{margin:28px 60px 0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:36px}
</style></head><body>
<nav><div class="logo">Dress Shopy</div><div class="links"><span>Inicio</span><span>Artículos</span><span>Perfil</span><span>Carrito</span></div><div class="cart"></div></nav>
<div class="band"><div class="copy"><h1>La colección,<br>a la vista.</h1><div class="search"><div class="in"></div><div class="btn"></div></div></div></div>
<div class="filters"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<h2>Selección</h2><div class="rail"><div></div><div></div><div></div><div></div><div></div></div>
</body></html>
